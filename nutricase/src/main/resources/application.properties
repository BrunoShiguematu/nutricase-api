# Nome da aplicação
spring.application.name=nutricase-api

# Conexão com o MySQL (cria o banco se não existir)
spring.datasource.url=jdbc:mysql://localhost:3306/nutricase?createDatabaseIfNotExist=true&serverTimezone=America/Sao_Paulo
# Usuário e senha de TESTE (apenas ambiente local)
spring.datasource.username=nutricase
spring.datasource.password=nutricase123
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Recria as tabelas a cada execução e carrega o import.sql
spring.jpa.hibernate.ddl-auto=create
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false

server.port=8080
